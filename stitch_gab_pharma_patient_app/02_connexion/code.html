<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #EDFDF4; /* Level 0 Background */
        }

            backdrop-filter: blur(8px);

<body class="flex flex-col min-h-screen text-on-background">
<!-- Top Navigation Suppression (Task-Focused Page) -->
<header class="w-full flex justify-center pt-xl pb-lg px-margin-mobile">
<img alt="Gab'Pharma Logo" class="h-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDPl-zaNOZ8JhGUk3f3ZstaGbIao80HPs9ykaHxYA_cwTswK8KXa7m5schtOE6FPiisM7QB3iHRPydKcq_q8DZ4Gg8A02WrNPCixD-7AKJH8SILcBe8C93Ttnt3sb-LnaUdTukftMWtWhcJWPajVs2LQOGGCnwF-DbSE6eQApj9OxbLmfKsZlNw6DxRFVkNpx-eQGsF2s5EDDXBgpw0CEbjbL6HNjqOXcyKPkY1OyJLBhMqjg0x-jeFt6hG4Cc5iKUuMs8"/>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile pb-xl">
<div class="w-full max-w-[400px] tonal-elevation-1 rounded-xl p-lg space-y-lg animate-in fade-in duration-700 slide-in-from-bottom-4">
<div class="text-center space-y-xs">
<h1 class="font-headline-lg text-headline-lg text-primary">Bon retour parmi nous</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Veuillez vous connecter pour accéder à votre espace santé.</p>
</div>
<form class="space-y-md" id="loginForm" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface" for="identifier">Identifiant (email/téléphone)</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<input class="w-full h-12 pl-12 pr-md rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md" id="identifier" placeholder="nom@exemple.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface" for="password">Mot de passe</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full h-12 pl-12 pr-12 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant hover:text-primary transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between py-xs">
<label class="flex items-center space-x-sm cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest transition-colors" type="checkbox"/>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Se souvenir de moi</span>
</label>
<a class="font-label-lg text-label-lg text-primary hover:underline transition-all" href="#">Mot de passe oublié ?</a>
</div>
<!-- Primary CTA -->
<button class="w-full h-[48px] bg-primary text-on-primary font-label-lg text-label-lg rounded-xl shadow-sm hover:bg-primary-container transition-all active:scale-[0.98] flex items-center justify-center" type="submit">
                    Se connecter
                </button>
</form>
<!-- Social Login / Alternative Divider -->
<div class="relative flex py-sm items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-on-surface-variant">OU CONTINUER AVEC</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Buttons (Secondary Style) -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center h-12 rounded-xl bg-surface-container border border-outline-variant hover:bg-surface-container-high transition-colors active:scale-95">
<img alt="Google" class="w-5 h-5 mr-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXewbB75B0tv8tKB-929PBrGzRmv1JErt-oXYfVvJbxDiiBC0ksWbZJ1bFL4gSb_OWnpJ_wCZdLSAg3qpw2tlgE7dvX0_m__qYcozBSSBRwoEjPgdivAMOSOgXJOYjEMJ8hajiB2zyMIZcfSJXEpLxmryvVdFuP7U4BxxCPhlzQtNOsvCgjgc1Lygelrino3qGm6abVrbp3Y3cH5xP9Bsesll7wRY90y0lBpJa0FuXy186IVAMc5zXAQ"/>
<span class="font-label-lg text-label-lg">Google</span>
</button>
<button class="flex items-center justify-center h-12 rounded-xl bg-surface-container border border-outline-variant hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined mr-sm text-[#1877F2]">face_nod</span>
<span class="font-label-lg text-label-lg">Facebook</span>
</button>
</div>
</div>
</main>
<!-- Footer Action -->
<footer class="w-full py-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
            Pas encore de compte ? 
            <a class="font-label-lg text-label-lg text-primary hover:underline ml-xs" href="#">S'inscrire</a>
</p>
</footer>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Simple button press interaction
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });
    </script>
</body></html>
