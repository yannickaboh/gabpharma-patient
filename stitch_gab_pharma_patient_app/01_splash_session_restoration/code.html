<div class="fixed inset-0 pointer-events-none opacity-20" id="particle-container"></div>
<script>
        // Simple particle effect for medical/clean feel
        function createParticles() {
            const container = document.getElementById('particle-container');
            const particleCount = 12;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                const size = Math.random() * 8 + 4;
                
                particle.style.position = 'absolute';
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = '#006a35';
                particle.style.borderRadius = '50%';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.opacity = '0.3';
                particle.style.filter = 'blur(1px)';
                
                // Random float animation
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * -20;
                
                particle.animate([
                    { transform: 'translate(0, 0)', opacity: 0.1 },
                    { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * -100 - 50}px)`, opacity: 0.4 },
                    { transform: `translate(${Math.random() * 200 - 100}px, ${Math.random() * -200 - 100}px)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });
                
                container.appendChild(particle);
            }
        }
        
        window.onload = createParticles;
    </script>
