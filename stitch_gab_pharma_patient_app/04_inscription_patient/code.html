<body class="min-h-screen flex flex-col items-center justify-start pb-12">
<!-- Top App Bar (Custom Implementation as per JSON hierarchy) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-margin-mobile h-14 bg-surface dark:bg-background border-b border-outline-variant dark:border-outline">
<button aria-label="Retour" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Gab'Pharma</span>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="mt-14 w-full max-w-md px-margin-mobile pt-lg animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Header Section -->
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Créer un compte</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Rejoignez le réseau de santé leader au Gabon pour gérer vos ordonnances et vos livraisons.</p>
</div>
<!-- Registration Form Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-md flex flex-col gap-md">
<!-- Hero Image Integration -->
<div class="relative w-full h-32 rounded-lg overflow-hidden mb-sm">
<img class="w-full h-full object-cover" data-alt="A clean, professional studio photograph of a modern Gabon pharmacy interior. The image is bright with high-key lighting and a soft mint green atmosphere. Shelves of medicine are visible in the soft-focus background, conveying health, trust, and cleanliness. The perspective is welcoming and patient-centric, adhering to a minimalist light-mode healthcare aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAPyQ5PV8R8j7_aang19s_BqVbCUALbMNxNrD5S92sQDwqxCXqoiarr-aPWax388pucNGPN7HYH7O431_W4AVnjcuXlsHzL3Y41WyUib_5EzN5TKsiWQsw-EdOnGddR92bwKn_skFdBMNDgEr0mGjeswmMeNgqwoLoHQDY4qrNPccYuB8Zch6mtgbA_cshrYXNUESMRxC4a93UjGzaXr2P1j1xRrtKYB9QypYga599ekxpnvDZA5F5u9Q"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
<form class="space-y-md" id="registration-form">
<!-- Name Row -->
<div class="grid grid-cols-2 gap-sm">
<div class="space-y-xs">
<label class="font-label-lg text-label-lg px-xs" for="firstname">Prénom</label>
<input class="w-full h-12 rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-transparent text-body-lg" id="firstname" placeholder="Ex: Jean" required="" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-lg text-label-lg px-xs" for="lastname">Nom</label>
<input class="w-full h-12 rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-transparent text-body-lg" id="lastname" placeholder="Ex: Moussavou" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg px-xs" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant">mail</span>
<input class="w-full h-12 pl-10 rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-transparent text-body-lg" id="email" placeholder="votre@email.com" required="" type="email"/>
</div>
</div>
<!-- Phone -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg px-xs" for="phone">Téléphone</label>
<div class="relative flex">
<div class="h-12 px-3 flex items-center border border-r-0 border-outline-variant rounded-l-lg bg-surface-container-low font-body-lg">
                            +241
                        </div>
<input class="w-full h-12 rounded-r-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-transparent text-body-lg" id="phone" placeholder="07 00 00 00" required="" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg px-xs" for="password">Mot de passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant">lock</span>
<input class="w-full h-12 pl-10 pr-10 rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-transparent text-body-lg" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-3 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pass-icon">visibility</span>
</button>
</div>

<div class="pt-sm px-xs space-y-xs">
<div class="flex gap-1 w-full">
<div class="strength-meter w-1/4 rounded-full bg-surface-container-high" id="meter-1"></div>
<div class="strength-meter w-1/4 rounded-full bg-surface-container-high" id="meter-2"></div>
<div class="strength-meter w-1/4 rounded-full bg-surface-container-high" id="meter-3"></div>
<div class="strength-meter w-1/4 rounded-full bg-surface-container-high" id="meter-4"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant" id="strength-text">Saisissez un mot de passe sécurisé</p>
</div>
</div>
<!-- Consent -->
<div class="space-y-sm pt-sm">
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline focus:ring-primary text-primary-container" required="" type="checkbox"/>
</div>
<span class="font-body-md text-body-md text-on-surface-variant select-none group-hover:text-on-surface transition-colors">
                            J'accepte les <a class="text-primary font-bold hover:underline" href="#">conditions générales d'utilisation</a> et la politique de confidentialité.
                        </span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary text-on-primary rounded-xl font-label-lg text-label-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    Créer mon compte
                    <span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>

<!-- Login Link -->
<div class="mt-md text-center">
<a class="font-label-lg text-label-lg text-primary hover:underline transition-all" href="#">
                    Déjà inscrit ? Se connecter
                </a>
</div>
</div>
<!-- Trust Badges -->
<div class="mt-xl flex justify-center gap-lg opacity-60">
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm">Sécurisé</span>
</div>
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
<span class="font-label-sm text-label-sm">Santé Gabon</span>
</div>
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
<span class="font-label-sm text-label-sm">Livraison</span>
</div>
</div>
</main>
<!-- Contextual Navigation (Suppressed for transactional screens as per "Shell Visibility" mandate) -->
<!-- Note: BottomNavBar is not rendered here because the intent is Transactional (Sign-up) -->
<script>
        // Password visibility toggle
        function togglePassword() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('pass-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Real-time password strength logic
        const passwordInput = document.getElementById('password');
        const meters = [
            document.getElementById('meter-1'),
            document.getElementById('meter-2'),
            document.getElementById('meter-3'),
            document.getElementById('meter-4')
        ];
        const strengthText = document.getElementById('strength-text');

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let strength = 0;
            
            if (val.length > 5) strength++;
            if (val.length > 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) strength++;
            if (val.length > 10 && /[^A-Za-z0-9]/.test(val)) strength++;
            if (val.length > 12) strength++;

            meters.forEach((m, idx) => {
                m.classList.remove('bg-error', 'bg-tertiary', 'bg-secondary', 'bg-primary-container', 'bg-surface-container-high');
                if (idx < strength) {
                    if (strength === 1) {
                        m.classList.add('bg-error');
                        strengthText.innerText = "Très faible";
                        strengthText.className = "font-label-sm text-label-sm text-error";
                    } else if (strength === 2) {
                        m.classList.add('bg-tertiary');
                        strengthText.innerText = "Moyen";
                        strengthText.className = "font-label-sm text-label-sm text-tertiary";
                    } else if (strength === 3) {
                        m.classList.add('bg-secondary');
                        strengthText.innerText = "Fort";
                        strengthText.className = "font-label-sm text-label-sm text-secondary";
                    } else {
                        m.classList.add('bg-primary-container');
                        strengthText.innerText = "Excellent";
                        strengthText.className = "font-label-sm text-label-sm text-primary";
                    }
                } else {
                    m.classList.add('bg-surface-container-high');
                }
            });

            if (val.length === 0) {
                strengthText.innerText = "Saisissez un mot de passe sécurisé";
                strengthText.className = "font-label-sm text-label-sm text-on-surface-variant";
            }
        });

        // Form submission animation
        document.getElementById('registration-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Création...';
            btn.disabled = true;
            
            setTimeout(() => {
                alert('Félicitations ! Votre compte Gab\'Pharma a été créé avec succès.');
                btn.innerHTML = 'Compte créé !';
                btn.classList.add('bg-secondary');
            }, 1500);
        });
    </script>
